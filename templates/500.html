<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>500 - Kesalahan Server | BMKG Wilayah IV</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}"
    />
    <style>
      .error-container {
        text-align: center;
        padding: 60px 20px;
        max-width: 600px;
        margin: 100px auto;
      }
      .error-code {
        font-size: 120px;
        font-weight: bold;
        color: #dc3545;
        margin: 0;
      }
      .error-title {
        font-size: 32px;
        margin: 20px 0;
        color: #333;
      }
      .error-message {
        font-size: 18px;
        color: #666;
        margin-bottom: 30px;
      }
      .error-details {
        background: #f8f9fa;
        padding: 20px;
        border-radius: 4px;
        margin: 20px 0;
        text-align: left;
        font-family: monospace;
      }
      .action-buttons {
        margin-top: 30px;
      }
      .btn-home {
        display: inline-block;
        padding: 12px 30px;
        background-color: #2c3e50;
        color: white;
        text-decoration: none;
        border-radius: 4px;
        font-weight: bold;
        transition: background-color 0.3s;
      }
      .btn-home:hover {
        background-color: #1a252f;
      }
    </style>
  </head>
  <body>
    <div class="error-container">
      <h1 class="error-code">500</h1>
      <h2 class="error-title">Kesalahan Server Internal</h2>
      <p class="error-message">
        Maaf, terjadi kesalahan pada server. Tim kami telah diberitahu.
      </p>

      {% if debug %}
      <div class="error-details">
        <strong>Debug Info:</strong><br />
        Error: {{ error }}<br />
        Path: {{ request.path }}
      </div>
      {% endif %}

      <div class="action-buttons">
        <a href="{{ url_for('dashboard') }}" class="btn-home">
          <i class="fas fa-home"></i> Kembali ke Dashboard
        </a>
        <a
          href="javascript:history.back()"
          class="btn-home"
          style="background-color: #6c757d; margin-left: 10px"
        >
          <i class="fas fa-arrow-left"></i> Kembali ke Halaman Sebelumnya
        </a>
      </div>
    </div>
  </body>
</html>
